<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGAN AI - Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d17;
            --card-bg: rgba(22, 27, 46, 0.75);
            --accent-color: #00f0ff;
            --accent-pink: #ff007f;
            --text-color: #e0e6ed;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at center, #1a1f38 0%, #080a12 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-color);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
        }

        .card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: #fff;
            margin-top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .light-preview {
            width: 100%;
            height: 60px;
            border-radius: 10px;
            margin: 15px 0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            background-color: #111;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--accent-color);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px var(--accent-color);
        }

        .chat-box {
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .chat-box { grid-column: span 1; }
        }

        #chat-history {
            height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .mic-btn {
            background: var(--accent-pink);
            border-color: var(--accent-pink);
        }

        .mic-btn:hover {
            background: #ff3399;
            box-shadow: 0 0 15px var(--accent-pink);
        }

        .status-tag {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>🤖 LOGAN AI - HUB</h1>

    <div class="container">
        <!-- CONTROL DE ILUMINACIÓN -->
        <div class="card">
            <h2>💡 Tira LED WS2812B</h2>
            <div id="lightView" class="light-preview"></div>
            <p>Estado: <span id="lightState" class="status-tag">Conectando...</span></p>
            
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                <label>Mezcla Personalizada:</label>
                <input type="color" id="colorPicker" value="#ffffff" onchange="cambiarColorPicker(this.value)" style="cursor:pointer; background:none; border:none; width:40px; height:40px;">
            </div>

            <div class="preset-buttons">
                <button onclick="enviarComando('Pon luces estilo cyberpunk')">Cyberpunk</button>
                <button onclick="enviarComando('Pon luces color verde menta')">Menta</button>
                <button onclick="enviarComando('Pon luces de atardecer')">Atardecer</button>
                <button onclick="enviarComando('Pon modo matrix')">Matrix</button>
                <button onclick="enviarComando('Encender luz')">Encender</button>
                <button onclick="enviarComando('Apagar luz')">Apagar</button>
            </div>
        </div>

        <!-- MONITOR DEL SISTEMA -->
        <div class="card">
            <h2>🚨 Estado Domótico</h2>
            <p>🚪 Sensor Puerta: <b id="doorStatus" style="color: #00ff66;">Sin alertas</b></p>
            <p>🌐 Servidor Backend: <b id="serverStatus" style="color: var(--accent-color);">Verificando...</b></p>
            
            <div style="margin-top: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="enviarComando('Pausa la música')">⏯️ Play/Pausa</button>
                <button onclick="enviarComando('Sube el volumen')">🔊 Volumen +</button>
            </div>
        </div>

        <!-- CHAT CON LOGAN -->
        <div class="card chat-box">
            <h2>💬 Conversación en Vivo</h2>
            <div id="chat-history">
                <p><i>🤖 Logan: Sistema inicializado. ¿Qué necesitas, Álvaro?</i></p>
            </div>
            <div class="input-group">
                <input type="text" id="userInput" placeholder="Escribe o pulsa el micrófono para hablar..." onkeypress="if(event.key==='Enter') enviarTexto()">
                <button onclick="enviarTexto()">Enviar</button>
                <button class="mic-btn" onclick="iniciarReconocimientoVoz()" title="Hablar por micrófono">🎙️</button>
            </div>
        </div>
    </div>

    <script>
        // URL DEL BACKEND EN RENDER
        const BACKEND_URL = "https://logan-server-ba38.onrender.com";

        function actualizarEstado() {
            fetch(`${BACKEND_URL}/esp32/status`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('serverStatus').innerText = "ONLINE";
                    document.getElementById('serverStatus').style.color = "#00ff66";

                    const view = document.getElementById('lightView');
                    const stateTxt = document.getElementById('lightState');
                    if(data.state === 'ON') {
                        view.style.backgroundColor = `rgb(${data.r}, ${data.g}, ${data.b})`;
                        view.style.boxShadow = `0 0 25px rgb(${data.r}, ${data.g}, ${data.b})`;
                        stateTxt.innerText = `ENCENDIDO (${data.r}, ${data.g}, ${data.b})`;
                        stateTxt.style.color = '#00ff66';
                    } else {
                        view.style.backgroundColor = '#111';
                        view.style.boxShadow = 'none';
                        stateTxt.innerText = 'APAGADO';
                        stateTxt.style.color = '#ff3366';
                    }
                })
                .catch(err => {
                    document.getElementById('serverStatus').innerText = "DESCONECTADO / INICIANDO";
                    document.getElementById('serverStatus').style.color = "#ffaa00";
                });
        }

        function enviarTexto() {
            const input = document.getElementById('userInput');
            const txt = input.value.trim();
            if(!txt) return;
            enviarComando(txt);
            input.value = '';
        }

        function enviarComando(texto) {
            const history = document.getElementById('chat-history');
            history.innerHTML += `<p><b>Tú:</b> ${texto}</p>`;
            history.scrollTop = history.scrollHeight;

            fetch(`${BACKEND_URL}/chat`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: texto})
            })
            .then(r => r.json())
            .then(data => {
                history.innerHTML += `<p><b>🤖 Logan:</b> ${data.reply}</p>`;
                history.scrollTop = history.scrollHeight;
                actualizarEstado();
            })
            .catch(err => {
                history.innerHTML += `<p style="color:#ff3366;"><b>System Error:</b> No se pudo comunicar con Logan en Render.</p>`;
            });
        }

        function cambiarColorPicker(hex) {
            const r = parseInt(hex.substr(1,2), 16);
            const g = parseInt(hex.substr(3,2), 16);
            const b = parseInt(hex.substr(5,2), 16);
            enviarComando(`Pon la luz en color R:${r} G:${g} B:${b}`);
        }

        function iniciarReconocimientoVoz() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Tu navegador no soporta reconocimiento de voz. Prueba desde Google Chrome o Safari.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.start();

            recognition.onresult = function(event) {
                const mensaje = event.results[0][0].transcript;
                enviarComando(mensaje);
            };
        }

        setInterval(actualizarEstado, 3000);
        actualizarEstado();
    </script>
</body>
</html>
